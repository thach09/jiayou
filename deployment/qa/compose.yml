# Disposable acceptance overlay only. No ports, host networking or privileged containers.
services:
  edge:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    labels:
      io.jiayou.managed: release-v1
      io.jiayou.project: ${JIAYOU_COMPOSE_PROJECT:?}
      io.jiayou.target: ${JIAYOU_TARGET_ID:?}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    volumes:
      - ${JIAYOU_QA_DIR:?}/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JIAYOU_QA_DIR:?}/tls/server.crt:/run/secrets/tls_cert:ro
      - ${JIAYOU_QA_DIR:?}/tls/server.key:/run/secrets/tls_key:ro
    networks:
      application:
        ipv4_address: ${JIAYOU_QA_EDGE_IP:?}
        aliases: [jiayou-qa.test]
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8081/_edge_health']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 128
  browser:
    image: jiayou-qa-browser:${JIAYOU_RELEASE_SHA:?}
    profiles: [acceptance]
    user: pwuser
    init: true
    # Chromium remains sandboxed; default seccomp plus namespace syscalls per Playwright.
    security_opt:
      - seccomp:${JIAYOU_QA_SECCOMP_PATH:?}
    networks: [application]
    shm_size: 256m
    mem_limit: 1536m
    cpus: 2
    pids_limit: 512
    environment:
      AUDIT_WEB_URL: https://jiayou-qa.test:8443/
      AUDIT_API_URL: https://jiayou-qa.test:8443/api/v1
      AUDIT_SOURCE_SHA: ${JIAYOU_RELEASE_SHA:?}
      AUDIT_ISOLATION_FILE: /qa-output/isolation.json
      AUDIT_ISOLATION_SHA256: ${JIAYOU_QA_ISOLATION_SHA256:-}
    volumes:
      - ${JIAYOU_QA_DIR:?}/tls/ca.crt:/qa-tls/ca.crt:ro
      - ${JIAYOU_QA_DIR:?}/output:/qa-output
