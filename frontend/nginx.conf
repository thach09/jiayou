server {
    listen 8080;
    server_name ${JIAYOU_PUBLIC_HOST};
    if ($host != ${JIAYOU_PUBLIC_HOST}) { return 421; }
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' https: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ~ ^/api/v1/(actuator|health)(/|$) { return 404; }
    location = /_jiayou_health { default_type text/plain; return 200 "ready\n"; }
    location /api/v1/ {
        # Only the reviewed physical ingress peer may assert HTTPS/client identity.
        if ($jiayou_forwarded_proto = "") { return 400; }
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control "no-store" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location / { try_files $uri $uri/ /index.html; }
}
